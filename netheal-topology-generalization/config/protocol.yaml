# Primary protocol — fixed before Unseen eval (Step 6)
min_devices: 6
max_devices: 6
max_episode_steps: 15
enable_user_hints: false

train_topology_types:
  - star
  - linear

mesh_instances:
  M1: 90001
  M2: 90002
  M3: 90003

# Set after runtime_benchmark (Step 6); initial PoC value
episodes_per_fault: 10

fault_types:
  - link_failure
  - device_failure
  - performance_degradation
  - misconfiguration

policy_training_seeds:
  - 1
  - 2
  - 3

